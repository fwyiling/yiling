# Tests Syndicates Desktop on real Windows and builds the installer + portable .exe.
name: Syndicates Desktop (Windows)
on:
  push:
    branches: [syndicates-desktop]
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
concurrency: # one run at a time, so two builds never publish the release at once
  group: desktop-windows
  cancel-in-progress: false
permissions:
  contents: write # publish passing builds to the desktop-latest release
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Win32 bindings parse (fake DLLs)
        run: node test/win32-bindings.test.js
      - name: Win32 bindings on real Windows
        run: node test/win32-real.smoke.js
      - name: App search knows every Start menu app (Store apps too)
        run: node test/apps.smoke.js
      - name: System controls helper works (volume, brightness, radios)
        run: node test/sysctl.smoke.js
      - name: Virtual-desktop helper works (drag a window onto the next desktop)
        run: node test/vdesk.smoke.js
      - name: Now-playing reader works
        run: node test/media.smoke.js
      - name: Song title, cover and play/pause with a real media session
        continue-on-error: true # depends on the runner having Windows' media session service
        run: node test/media-session.smoke.js
      - name: App starts and runs for 15 seconds
        shell: pwsh
        run: |
          $out = npx electron . --smoke 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'SMOKE ') { throw 'the app did not finish its smoke run' }
          if ($out -match 'A JavaScript error occurred|Uncaught') { throw 'the app hit an error' }
      - name: Build installer and portable exe
        run: npx electron-builder --win portable nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: The built exe starts and runs for 15 seconds
        shell: pwsh
        run: |
          $out = & ".\dist\win-unpacked\Syndicates Desktop.exe" --smoke 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'SMOKE ') { throw 'the built app did not finish its smoke run' }
          if ($out -match 'A JavaScript error occurred|Uncaught|Cannot find module') { throw 'the built app hit an error' }
          if ($out -notmatch '"deskWorker":true') { throw 'the desktop watcher did not start on its worker thread in the built app' }
      - name: With the dock on, the taskbar hides while running and comes back on quit
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA 'Syndicates Desktop'
          New-Item -ItemType Directory -Force $dir | Out-Null
          '{"dock":{"on":true,"hide":"never"}}' | Set-Content -Encoding utf8 (Join-Path $dir 'settings.json')
          $out = & ".\dist\win-unpacked\Syndicates Desktop.exe" --smoke 2>&1 | Out-String
          Write-Output $out
          Remove-Item (Join-Path $dir 'settings.json')
          if ($out -notmatch '"dock":true') { throw 'the dock did not start' }
          if ($out -notmatch '"taskbarVisible":false') { throw 'the Windows taskbar stayed visible next to the dock' }
          node -e "const v = require('./win32').taskbarVisible(); console.log('taskbar visible after quitting:', v); process.exit(v ? 0 : 1)"
      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        # a copy for this run only: the release below is where the builds live. Kept for a day, and never a reason
        # to fail (the account's artifact storage filled up with 90-day copies of every build, ~160 MB each)
        continue-on-error: true
        with:
          retention-days: 1
          name: Syndicates-Desktop-Windows
          path: |
            desktop/dist/Syndicates-Desktop-Setup.exe
            desktop/dist/Syndicates-Desktop-Portable.exe
          if-no-files-found: error
      - name: Show the bare desktop (minimize every window, like Win+D)
        shell: pwsh
        run: |
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 2
      - name: Compare ways of joining the desktop layer
        run: npx electron test/electron-smoke.js --compare
      - name: Wallpaper shows behind the desktop icons
        run: npx electron test/electron-smoke.js
      - name: Upload the desktop screenshot from the test
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: smoke-desktop-screenshot
          path: desktop/smoke-*.png
          if-no-files-found: ignore
      - name: Publish to the desktop-latest release (only builds that passed everything)
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag 2>$null; $global:LASTEXITCODE = 0
          gh release create desktop-latest dist/Syndicates-Desktop-Setup.exe dist/Syndicates-Desktop-Portable.exe `
            --target $env:GITHUB_SHA --prerelease --title "Syndicates Desktop (latest)" `
            --notes "Built from $($env:GITHUB_SHA.Substring(0,7)) after passing the Windows tests. Setup.exe installs it (Start menu + desktop shortcut, starts with Windows); Portable.exe runs without installing."
