[package]
name = "syndicate-studio"
version = "2.5.0"
description = "Starblast client: the game with the Studio client built in, light on GPU, CPU and RAM"
edition = "2021"

[lib]
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# the client with the game on three.js r124 (a separate app: tauri.r124.conf.json)
r124 = []
# the same on three.js r187 (a separate app: tauri.r187.conf.json)
r187 = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
