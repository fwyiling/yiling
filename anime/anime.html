<!doctype html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ani Manga · Anime</title>
  <link rel="stylesheet" href="anime.css">
</head>
<body>
  <header class="top">

    <nav class="am-switch" aria-label="Ani Manga sections"><a class="on" aria-current="page">Anime</a><a href="../library/library.html">Manga</a></nav>

      <button data-tab="discover" class="on">Discover</button>
