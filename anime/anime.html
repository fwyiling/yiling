<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syndicates · Anime</title>
  <link rel="stylesheet" href="anime.css">
</head>
<body>
  <header class="top">
