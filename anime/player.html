<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syndicates · Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <header class="bar">
    <a class="back" href="anime.html">← Anime</a>
    <div class="meta">
      <b id="animeTitle"></b>
      <span id="epLabel"></span>
    </div>
    <div class="hdr-actions">
      <button id="prevBtn" title="Previous episode" disabled>◀</button>
      <button id="nextBtn" title="Next episode" disabled>▶</button>
      <button id="dlBtn">⬇ Download</button>
    </div>
  </header>

  <div id="stage">
    <video id="video" controls></video>
    <div id="overlay">
      <p id="msg">Loading…</p>
      <button id="fallbackBtn" hidden>Open on HiAnime ↗</button>
    </div>
  </div>

  <div id="epRow">
    <div id="epList"></div>
  </div>

  <script type="module" src="player.js"></script>
</body>
</html>
