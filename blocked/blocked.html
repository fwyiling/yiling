<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dangerous site blocked</title>
  <style>
    :root { --a: #5e7d9c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(900px 500px at 50% -10%, #ff3b3b33, transparent 60%), #0e0e12;
      color: #f2f2f5; font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif; }
    .card { max-width: 520px; width: 100%; text-align: center; }
    .shield { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 24px; display: grid; place-items: center;
      background: linear-gradient(135deg, #ff4d4d, #c4002b); box-shadow: 0 12px 40px #ff2a4a55; }
    .shield svg { width: 44px; height: 44px; fill: #fff; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #b4b4c2; margin: 0 0 6px; }
    .site { display: inline-block; margin: 10px 0 22px; padding: 6px 12px; border-radius: 8px; background: #1b1b23; border: 1px solid #2a2a36;
      font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #fff; word-break: break-all; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button { font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 12px; cursor: pointer; border: 0; }
    .safe { background: #2ecc71; color: #06260f; }
    .risk { background: none; color: #8a8a9a; text-decoration: underline; font-weight: 400; padding: 12px 8px; }
    .risk:hover { color: #ff8a8a; }
    small { display: block; margin-top: 26px; color: #6d6d7c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 5h2v6h-2V7Zm0 8h2v2h-2v-2Z"/></svg></div>
    <h1>Dangerous site blocked</h1>
    <p>Syndicates Client stopped this page before it loaded.</p>
    <p>It's on a list of sites known to spread malware or scams.</p>
    <div class="site" id="site">this site</div>
    <div class="row">
      <button class="safe" id="back">Take me back to safety</button>
      <button class="risk" id="go" hidden>Continue anyway (not recommended)</button>
    </div>
    <small>Source: abuse.ch URLhaus malware list</small>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
