<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d232c"/><stop offset="1" stop-color="#0c0f13"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="26" y1="26" x2="80" y2="80">
      <stop offset="0" stop-color="#8aa3bd"/><stop offset="1" stop-color="#5e7d9c"/>
    </linearGradient>
    <linearGradient id="grey" gradientUnits="userSpaceOnUse" x1="54" y1="54" x2="108" y2="108">
      <stop offset="0" stop-color="#d3d8de"/><stop offset="1" stop-color="#a7afb8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="2"/>
  <!-- two linked rounded squares: grey-blue passes over at top-right, grey over at bottom-left -->
  <g fill="none" stroke-width="11">
    <rect x="26" y="26" width="48" height="48" rx="14" stroke="url(#blue)"/>
    <path d="M54 62 V86" stroke="#141920" stroke-width="19"/>
    <rect x="54" y="54" width="48" height="48" rx="14" stroke="url(#grey)"/>
    <path d="M74 44 V64" stroke="#141920" stroke-width="19"/>
    <path d="M74 42 V66" stroke="url(#blue)" stroke-linecap="butt"/>
  </g>
</svg>
