<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' sd: data:; media-src sd:; frame-src https: http:; connect-src 'self'">
  <title>Syndicates Desktop</title>
  <link rel="stylesheet" href="wallpaper.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <nav class="side">
    <div class="brand"><img src="logo.svg" alt="" width="30" height="30"><b>Syndicates<br><small>Desktop</small></b></div>
    <button data-tab="wallpaper" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>Wallpaper</button>
    <button data-tab="widgets"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>Widgets</button>
    <button data-tab="home"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>Home panel</button>
    <button data-tab="general"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>General</button>
    <div class="grow"></div>
    <button id="openHome" class="ghost">Open Home <kbd id="hk"></kbd></button>
  </nav>
  <main>
    <div class="preview-wrap">
      <div id="preview" class="preview"></div>
      <p class="tip" id="tip">This is your desktop. Changes apply instantly.</p>
    </div>
    <section data-panel="wallpaper" class="on">
      <h2>Scene</h2>
      <div id="scenes" class="scenes"></div>
      <div id="fileRow" class="row" hidden><button id="pick" class="btn">Choose file…</button><span id="fileName" class="muted"></span></div>
      <div id="urlRow" class="row" hidden><input id="url" class="field" placeholder="https://… a page to use as your wallpaper"><button id="urlSet" class="btn">Use</button></div>
      <h2>Colours</h2>
      <div class="row"><div id="presets" class="presets"></div><span class="sep"></span><input type="color" data-color="0"><input type="color" data-color="1"><input type="color" data-color="2"></div>
      <h2>Motion</h2>
      <label class="slider"><span>Speed</span><input type="range" min="0.25" max="2" step="0.05" data-k="wallpaper.speed"><em></em></label>
      <label class="slider"><span>Intensity</span><input type="range" min="0" max="1" step="0.05" data-k="wallpaper.intensity"><em></em></label>
      <label class="slider"><span>Darken</span><input type="range" min="0" max="0.7" step="0.05" data-k="wallpaper.dim"><em></em></label>
      <label class="switch"><span><b>Follow the mouse</b><small>The wallpaper and widgets drift a little with your cursor.</small></span><input type="checkbox" data-k="wallpaper.parallax"></label>
    </section>
    <section data-panel="widgets">
      <p class="muted">Drag widgets in the preview above to move them.</p>
      <label class="field-row"><span>Your name <small>(for the greeting)</small></span><input class="field" data-k="name" placeholder="e.g. Steven"></label>
      <div id="wlist" class="wlist"></div>
    </section>
    <section data-panel="home">
      <label class="field-row"><span>Shortcut to open Home</span><button id="hotkey" class="btn keycap"></button></label>
      <label class="field-row"><span>Web search</span><select class="field" data-k="home.engine"><option value="google">Google</option><option value="bing">Bing</option><option value="duckduckgo">DuckDuckGo</option><option value="brave">Brave</option></select></label>
      <div class="row"><button id="clearPins" class="btn ghost">Unpin all apps</button><span class="muted" id="pinCount"></span></div>
    </section>
    <section data-panel="general">
      <label class="switch"><span><b>Start with Windows</b><small>Your wallpaper is back after every restart.</small></span><input type="checkbox" data-k="general.startWithWindows"></label>
      <label class="switch"><span><b>Pause during full-screen apps</b><small>Games and full-screen video get all the power.</small></span><input type="checkbox" data-k="general.pauseOnFullscreen"></label>
      <label class="switch"><span><b>Pause on battery</b><small>Saves battery on laptops.</small></span><input type="checkbox" data-k="general.pauseOnBattery"></label>
      <label class="switch"><span><b>Hide desktop icons</b><small>A clean desktop; your files stay in the Desktop folder.</small></span><input type="checkbox" data-k="general.hideDesktopIcons"></label>
      <label class="field-row"><span>Frame rate</span><select class="field" data-k="general.fps"><option value="30">30 fps (lighter)</option><option value="60">60 fps (smoother)</option></select></label>
      <label class="field-row"><span>Accent colour</span><input type="color" data-k="accent"></label>
    </section>
  </main>
  <script type="module" src="settings.js"></script>
</body>
</html>
