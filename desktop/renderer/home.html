<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: sd: https://www.gutenberg.org; connect-src 'self'">
  <title>Syndicates Home</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div id="backdrop"></div>
  <main id="panel">
    <header class="top">
      <div><div id="greet"></div><div id="date"></div></div>
      <div id="time"></div>
    </header>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" placeholder="Search apps, files, folders or the web" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <section id="results" hidden></section>
    <div class="cols">
      <section class="apps main">
        <nav class="tabs">
          <button data-t="apps" class="on">Apps</button><button data-t="time">Timetable</button><button data-t="books">Books</button><button data-t="files">Files</button><button data-t="clip">Clipboard</button>
        </nav>
        <div data-p="apps">
          <div class="sec-h"><h2 id="appsTitle">Pinned</h2><div><button id="allBtn" class="chip">All apps</button><button id="addPin" class="chip" title="Pin an app or file">+ Pin</button></div></div>
          <div id="grid" class="grid"></div>
        </div>
        <div data-p="time" hidden>
          <div class="sec-h"><div id="dayChips" class="days"></div><span id="nowNext" class="muted"></span></div>
          <ul id="classes" class="rows"></ul>
          <form id="classForm" class="addrow">
            <input id="cTitle" placeholder="Subject" required maxlength="40">
            <input id="cPlace" placeholder="Room" maxlength="20">
            <input id="cStart" type="time" value="09:00" required>
            <input id="cEnd" type="time" value="10:00" required>
            <button class="chip on">Add</button>
          </form>
        </div>
        <div data-p="books" hidden>
          <form id="bookForm" class="addrow"><input id="bookQ" placeholder="Search Project Gutenberg: title or author" autocomplete="off"><button class="chip on">Search</button></form>
          <div class="sec-h" id="readingH"><h2>Reading list</h2><span class="muted">Opens in your browser · same library as the Syndicates Client</span></div>
          <div id="reading" class="books"></div>
          <div class="sec-h"><h2 id="bookResH">Popular</h2></div>
          <div id="bookRes" class="books"></div>
        </div>
        <div data-p="clip" hidden>
          <div class="sec-h"><input id="clipQ" class="mini-search" placeholder="Search what you copied…" autocomplete="off" spellcheck="false"><span><span class="muted" id="clipHint">Click to paste · Alt+Shift+V</span><button id="clipClearH" class="chip" title="Deletes everything except what you pinned">Clear unpinned</button></span></div>
          <ul id="clipList" class="clips"></ul>
        </div>
        <div data-p="files" hidden>
          <div class="sec-h"><div id="fileKinds" class="days">
            <button class="chip on" data-kind="all">All</button><button class="chip" data-kind="pdf">PDFs</button><button class="chip" data-kind="doc">Documents</button><button class="chip" data-kind="img">Images</button>
          </div><input id="fileQ" class="mini-search" placeholder="Search files…" autocomplete="off" spellcheck="false"></div>
          <ul id="fileList" class="rows files"></ul>
        </div>
      </section>
      <aside class="side">
        <div class="card np" id="npCard" hidden>
          <div class="art none"><svg class="note" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></div>
          <div class="txt"><b id="npTitle"></b><span id="npArtist"></span></div>
          <div class="mctl"><button data-m="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8 6 8 6z"/></svg></button><button data-m="toggle" class="pp" title="Play / pause"><svg viewBox="0 0 24 24" class="play"><path d="M8 5.5v13l10-6.5z"/></svg><svg viewBox="0 0 24 24" class="pause"><path d="M8.5 5.5v13M15.5 5.5v13"/></svg></button><button data-m="next" title="Next"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 6l8 6-8 6z"/></svg></button></div>
        </div>
        <div class="card" id="goalCard">
          <div class="sec-h"><h2>Daily goals</h2><span id="goalNote" class="muted"></span></div>
          <div class="goal" data-k="revision"><div class="gl"><b>Revision</b><span></span></div><div class="gbar"><i></i></div><div class="gbtns"><button class="chip go">Start</button><button class="chip add" title="Add 15 min (right-click: take 15 off)">+15</button></div></div>
          <div class="goal" data-k="hobby"><div class="gl"><b>Hobby</b><span></span></div><div class="gbar"><i></i></div><div class="gbtns"><button class="chip go">Start</button><button class="chip add" title="Add 15 min (right-click: take 15 off)">+15</button></div></div>
        </div>
        <div class="card" id="todoCard">
          <div class="sec-h"><h2>To-do</h2><span id="todoCount" class="muted"></span></div>
          <ul id="todos"></ul>
          <form id="todoForm"><input id="todoIn" placeholder="Add a task and press Enter" autocomplete="off"></form>
        </div>
        <div class="card"><div class="sec-h"><h2>Notes</h2></div><textarea id="notes" placeholder="Anything to remember…" spellcheck="false"></textarea></div>
        <div class="card">
          <div class="sec-h"><h2>Places</h2><button id="iconsBtn" class="chip"></button></div>
          <div class="places">
            <button data-place="pc"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>This PC</button>
            <button data-place="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span id="homeName">Home</span></button>
            <button data-place="downloads"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Downloads</button>
            <button data-place="documents"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>Documents</button>
            <button data-place="recycle"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>Recycle Bin</button>
          </div>
        </div>
      </aside>
    </div>
    <footer class="foot">
      <span class="muted" id="hint"></span>
      <div class="pwr" id="pwr">
        <button id="customize" class="chip">Customize desktop…</button>
        <button id="pwrBtn" class="chip pbtn" title="Lock, sleep, restart, shut down"><svg viewBox="0 0 24 24"><path d="M12 3v8M7 6.3a7.5 7.5 0 1 0 10 0"/></svg>Power</button>
        <div id="pwrMenu" class="pmenu" hidden>
          <button data-pw="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Lock</span></button>
          <button data-pw="sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Sleep</span></button>
          <button data-pw="restart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg><span>Restart</span></button>
          <button data-pw="shutdown"><svg viewBox="0 0 24 24"><path d="M12 3v8M7 6.3a7.5 7.5 0 1 0 10 0"/></svg><span>Shut down</span></button>
          <button data-pw="signout"><svg viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M19 12H9"/></svg><span>Sign out</span></button>
        </div>
      </div>
    </footer>
  </main>
  <script type="module" src="home.js"></script>
</body>
</html>
