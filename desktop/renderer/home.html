<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>Syndicates Home</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div id="backdrop"></div>
  <main id="panel">
    <header class="top">
      <div><div id="greet"></div><div id="date"></div></div>
      <div id="time"></div>
    </header>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" placeholder="Search apps or the web…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <section id="results" hidden></section>
    <div class="cols">
      <section class="apps">
        <div class="sec-h"><h2 id="appsTitle">Pinned</h2><div><button id="allBtn" class="chip">All apps</button><button id="addPin" class="chip" title="Pin an app or file">+ Pin</button></div></div>
        <div id="grid" class="grid"></div>
      </section>
      <aside class="side">
        <div class="card" id="todoCard">
          <div class="sec-h"><h2>To-do</h2><span id="todoCount" class="muted"></span></div>
          <ul id="todos"></ul>
          <form id="todoForm"><input id="todoIn" placeholder="Add a task and press Enter" autocomplete="off"></form>
        </div>
        <div class="card"><div class="sec-h"><h2>Notes</h2></div><textarea id="notes" placeholder="Anything to remember…" spellcheck="false"></textarea></div>
        <div class="card sys">
          <div class="bar"><span>CPU</span><i><b id="cpuBar"></b></i><em id="cpu">–</em></div>
          <div class="bar"><span>RAM</span><i><b id="memBar"></b></i><em id="mem">–</em></div>
          <div id="weather" class="muted"></div>
        </div>
      </aside>
    </div>
    <footer class="foot">
      <span class="muted" id="hint"></span>
      <button id="customize" class="chip">Customize desktop…</button>
    </footer>
  </main>
  <script type="module" src="home.js"></script>
</body>
</html>
