<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>Syndicates Top Bar</title>
  <link rel="stylesheet" href="topbar.css">
</head>
<body>
  <div id="bar">
    <div class="left">
      <button id="logo" title="Syndicates"><img src="logo.svg" alt=""></button>
      <b id="app"></b>
      <div id="desks" title="Desktops (three-finger swipe left / right to switch)"></div>
    </div>
    <div class="right">
      <div id="np" class="seg" hidden>
        <button id="npToggle" class="ic" title="Play / pause"><svg viewBox="0 0 24 24" class="play"><path d="M8 5.5v13l10-6.5z"/></svg><svg viewBox="0 0 24 24" class="pause"><path d="M8.5 5.5v13M15.5 5.5v13"/></svg></button>
        <span id="npText"></span>
      </div>
      <span id="weather" class="seg" hidden></span>
      <button id="battery" class="seg" hidden title="Battery and power"><i class="cell"><b></b></i><span></span></button>
      <button id="timerBtn" class="seg ic" title="Timer (Ctrl+Alt+T)"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg></button>
      <button id="wifiBtn" class="seg ic" title="Wi-Fi"><svg viewBox="0 0 24 24"><path d="M2.5 9.5a14 14 0 0 1 19 0M5.8 13a9 9 0 0 1 12.4 0M9.2 16.4a4 4 0 0 1 5.6 0"/><circle cx="12" cy="19.6" r=".9"/></svg></button>
      <button id="quick" class="seg ic" title="Sound, brightness and more"><svg viewBox="0 0 24 24"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/><path d="M15 9a4 4 0 0 1 0 6M17.6 6.6a7.5 7.5 0 0 1 0 10.8"/></svg></button>
      <button id="clock" class="seg" title="Notifications and calendar"></button>
    </div>
  </div>
  <script type="module" src="topbar.js"></script>
</body>
</html>
