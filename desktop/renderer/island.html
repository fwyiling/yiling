<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>Syndicates Island</title>
  <link rel="stylesheet" href="island.css">
</head>
<body>
  <div id="island" class="compact">
    <!-- compact: a tiny live view -->
    <div class="mini">
      <div class="lead">
        <svg class="ring" viewBox="0 0 20 20"><circle class="bg" cx="10" cy="10" r="8"/><circle class="fg" cx="10" cy="10" r="8"/></svg>
        <div class="art mini-art"></div>
      </div>
      <svg class="idle-ico" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg>
      <div class="pet" id="pet"></div>
      <span class="lyr" hidden></span>
      <div class="trail"><span class="gk"></span><span class="t"></span><i class="eq"><s></s><s></s><s></s><s></s></i></div>
    </div>
    <!-- open: media and timer -->
    <div class="panel">
      <section class="media" hidden>
        <div class="art big-art"><svg class="note" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></div>
        <div class="txt"><b class="title"></b><span class="artist"></span></div>
        <div class="ctl">
          <button data-m="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8 6 8 6z"/></svg></button>
          <button data-m="toggle" class="pp" title="Play / pause"><svg viewBox="0 0 24 24" class="play"><path d="M8 5.5v13l10-6.5z"/></svg><svg viewBox="0 0 24 24" class="pause"><path d="M8.5 5.5v13M15.5 5.5v13"/></svg></button>
          <button data-m="next" title="Next"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 6l8 6-8 6z"/></svg></button>
        </div>
        <div class="prog" hidden><span class="p-now">0:00</span><input type="range" class="seek" min="0" max="100" step="1" value="0" aria-label="Position in the song"><span class="p-dur">0:00</span></div>
        <div class="lyrics" hidden><b class="l-now"></b><span class="l-next"></span></div>
      </section>
      <section class="focus" hidden>
        <div class="row head"><svg viewBox="0 0 24 24" class="ico"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><b>Daily goals</b><span class="f-sub"></span><button id="fFocus" class="pill-b f-focus" title="Focus mode (Ctrl+Alt+F): distractions get a nudge">Focus off</button></div>
        <div class="f-week"><span id="fWeek"></span><i class="f-days"></i></div>
        <div class="f-run">
          <div class="big"><span id="fNow">0:00:00</span><small id="fOf"></small></div>
          <div class="bar"><b id="fProg"></b></div>
          <div class="row btns"><button id="fStop" class="pill-b accent">Stop</button><button id="fSwap" class="pill-b"></button></div>
        </div>
        <div class="f-idle">
          <div class="f-g" data-k="revision"><div class="f-l"><b>Revision</b><span></span></div><div class="bar"><b></b></div><button class="pill-b" data-start="revision">Start revising</button></div>
          <div class="f-g" data-k="hobby"><div class="f-l"><b>Hobby</b><span></span></div><div class="bar"><b></b></div><button class="pill-b" data-start="hobby">Start hobby</button></div>
        </div>
      </section>
      <section class="timer">
        <button class="perch" id="perch"><div class="pet"></div></button>
        <div class="idle-ui">
          <div class="row head"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg><b>Timer</b></div>
          <div class="row presets"></div>
          <div class="row custom">
            <button class="round" data-step="-5" title="5 min less">−</button>
            <span class="mins"><b id="mins">15</b> min</span>
            <button class="round" data-step="5" title="5 min more">+</button>
            <button class="go" id="start">Start</button>
          </div>
        </div>
        <div class="run-ui">
          <div class="big"><span id="left">00:00</span><small id="of"></small></div>
          <div class="bar"><b id="prog"></b></div>
          <div class="row btns">
            <button id="pauseBtn" class="pill-b">Pause</button>
            <button id="plus" class="pill-b">+1 min</button>
            <button id="reset" class="pill-b ghost">Reset</button>
          </div>
        </div>
      </section>
    </div>
    <!-- short pop-ups: volume, brightness, Caps Lock, headphones -->
    <div class="osd">
      <svg class="o-ic" viewBox="0 0 24 24"></svg>
      <span class="o-txt"></span>
      <i class="o-bar"><b></b></i>
      <em class="o-val"></em>
    </div>
    <!-- time's up -->
    <div class="alert">
      <div class="pet" id="alertPet" data-mood="cheer"></div>
      <svg viewBox="0 0 24 24" class="bell"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <div class="txt"><b>Time's up</b><span id="doneOf"></span></div>
      <button id="more" class="pill-b">+5 min</button>
      <button id="dismiss" class="pill-b accent">Dismiss</button>
    </div>
  </div>
  <script type="module" src="island.js"></script>
</body>
</html>
