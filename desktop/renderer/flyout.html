<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>Syndicates Panel</title>
  <link rel="stylesheet" href="flyout.css">
</head>
<body>
  <!-- the top bar's menu -->
  <nav id="menu" class="panel" hidden></nav>
  <!-- control centre -->
  <div id="control" class="panel" hidden>
    <section class="card media" id="cMedia" hidden>
      <div class="art"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></div>
      <div class="txt"><small id="cApp"></small><b id="cTitle"></b><span id="cArtist"></span></div>
      <div class="ctl">
        <button data-m="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 6l-8 6 8 6z"/></svg></button>
        <button data-m="toggle" class="pp" title="Play / pause"><svg viewBox="0 0 24 24" class="play"><path d="M8 5.5v13l10-6.5z"/></svg><svg viewBox="0 0 24 24" class="pause"><path d="M8.5 5.5v13M15.5 5.5v13"/></svg></button>
        <button data-m="next" title="Next"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 6l8 6-8 6z"/></svg></button>
      </div>
    </section>
    <section class="card">
      <div class="tiles">
        <div class="tile split" id="tWifi"><button class="main"><svg viewBox="0 0 24 24"><path d="M2.5 9.5a14 14 0 0 1 19 0M5.8 13a9 9 0 0 1 12.4 0M9.2 16.4a4 4 0 0 1 5.6 0"/><circle cx="12" cy="19.6" r=".9"/></svg></button><button class="more" data-page="wifi"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><label>Wi-Fi</label></div>
        <div class="tile split" id="tBt"><button class="main"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg></button><button class="more" data-page="bluetooth"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><label>Bluetooth</label></div>
        <div class="tile" id="tAir"><button class="main"><svg viewBox="0 0 24 24"><path d="M10.5 3.5c0-.8.7-1.5 1.5-1.5s1.5.7 1.5 1.5V9l7 4v2l-7-2v5l2 1.5V21l-3.5-1L8.5 21v-1.5l2-1.5v-5l-7 2v-2l7-4z"/></svg></button><label>Airplane mode</label></div>
        <div class="tile link" data-page="batterysaver"><button class="main"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10.5v3M9 10l-2 3h4l-2 3"/></svg></button><label>Energy saver</label></div>
        <div class="tile link" data-page="nightlight"><button class="main"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button><label>Night light</label></div>
        <div class="tile link" data-page="accessibility"><button class="main"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8"/><path d="M5 8l7 1.5L19 8M12 9.5V14l-3 7M12 14l3 7"/></svg></button><label>Accessibility</label></div>
      </div>
      <div class="sliders">
        <div class="slide" id="sBright"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><input type="range" min="0" max="100" id="bright"><em id="brightV"></em></div>
        <div class="slide" id="sVol"><button id="muteBtn" class="ic-b" title="Mute"><svg viewBox="0 0 24 24" class="ic"><path d="M4 9.5h3l4-3.5v12l-4-3.5H4z"/><path class="wave" d="M15 9a4 4 0 0 1 0 6M17.6 6.6a7.5 7.5 0 0 1 0 10.8"/><path class="x" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg></button><input type="range" min="0" max="100" id="vol"><em id="volV"></em><button class="more" data-page="sound" title="Sound output"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
        <div id="outs" class="outs" hidden></div>
      </div>
      <footer><span id="cBattery"></span><button class="ic-b" data-page="home" title="Windows Settings"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></footer>
    </section>
  </div>
  <!-- Wi-Fi networks -->
  <div id="wifi" class="panel pad" hidden>
    <div class="ph"><b>Wi-Fi</b><button id="wifiRefresh" class="ic-b" title="Scan again"><svg viewBox="0 0 24 24" class="ic"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg></button><label class="sw"><input type="checkbox" id="wifiOn"><i></i></label></div>
    <ul id="nets" class="nets"></ul>
    <footer class="pf"><span id="wifiNote" class="muted"></span><button class="link" data-page="wifi">Network settings</button></footer>
  </div>
  <!-- the dock's Screenshots stack: recent shots; click to open, drag one into another app -->
  <div id="shots" class="panel pad up" hidden>
    <div class="ph"><b>Screenshots</b><button id="shotTake" class="ic-b" title="Take a screenshot (Win+Shift+S)"><svg viewBox="0 0 24 24" class="ic"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <ul id="shotGrid" class="shots"></ul>
    <footer class="pf"><span id="shotNote" class="muted"></span><button class="link" id="shotFolder">Open in Explorer</button></footer>
  </div>
  <!-- a dock app's windows, as live previews: click one to go to it, x (or middle-click) closes it -->
  <div id="windows" class="panel pad up" hidden>
    <div class="ph"><b id="winsTitle"></b></div>
    <ul id="winGrid" class="wins"></ul>
  </div>
  <!-- tray icons that don't fit in the top bar -->
  <div id="trayp" class="panel pad" hidden>
    <div class="ph"><b>Tray icons</b></div>
    <small class="muted tray-h">In the top bar</small>
    <div id="trayGrid" class="traygrid"></div>
    <small class="muted tray-h">Hidden</small>
    <div id="trayHid" class="traygrid"></div>
    <p class="muted tray-tip">The eye hides or shows an icon in the top bar. Middle-click one in the bar to hide it.</p>
  </div>
  <!-- battery and power -->
  <div id="battery" class="panel pad" hidden>
    <div class="bat"><div class="big"><b id="batPct">–</b><span id="batState" class="muted"></span></div><i class="cell"><b id="batFill"></b></i></div>
    <label class="row-sw"><span><b>Low power mode</b><small>Best power efficiency and the wallpaper paused.</small></span><span class="sw"><input type="checkbox" id="lowPower"><i></i></span></label>
    <div class="grp"><small>Power mode</small><div class="seg" id="powerMode"><button value="efficiency">Efficiency</button><button value="balanced">Balanced</button><button value="performance">Performance</button></div></div>
    <div class="grp" id="hzGrp"><small>Screen refresh rate</small><div class="seg" id="hz"></div><p class="warn" id="hzWarn" hidden></p></div>
    <footer class="pf"><span></span><button class="link" data-page="batterysaver">Battery settings</button></footer>
  </div>
  <!-- calendar -->
  <div id="calendar" class="panel pad" hidden>
    <div class="ch"><div><b id="calToday"></b><span id="calLunar" class="muted"></span></div></div>
    <div class="mh"><b id="calMonth"></b><span><button id="calPrev" class="ic-b"><svg viewBox="0 0 24 24" class="ic"><path d="M15 6l-6 6 6 6"/></svg></button><button id="calNext" class="ic-b"><svg viewBox="0 0 24 24" class="ic"><path d="M9 6l6 6-6 6"/></svg></button></span></div>
    <div id="calGrid" class="cal"></div>
    <div class="agenda"><small>Today</small><ul id="agenda"></ul></div>
    <div class="focus"><button class="round" id="fMinus">−</button><span><b id="fMins">30</b> min</span><button class="round" id="fPlus">+</button><button class="go" id="fStart">Start focus</button></div>
  </div>
  <script type="module" src="flyout.js"></script>
</body>
</html>
