<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shield Music</title>
  <link rel="stylesheet" href="music.css">
</head>
<body>
  <aside id="side">
    <div class="brand"><img src="../icons/icon48.png" alt="" width="30" height="30"><span>Shield Music</span></div>
    <nav>
      <button data-view="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9Z"/></svg>Home</button>
      <button data-view="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Search</button>
    </nav>
    <div class="lib">
      <div class="lib-h">Your library <button id="newPl" title="New playlist">+</button></div>
      <button data-view="liked" class="libitem"><span class="cover liked">♥</span><span><b>Liked Songs</b><small id="likedCount">0 songs</small></span></button>
      <button data-view="recent" class="libitem"><span class="cover recent">⟲</span><span><b>Recently played</b><small>History</small></span></button>
      <div id="playlists"></div>
    </div>
  </aside>

  <main id="main">
    <div id="view"></div>
  </main>

  <aside id="now">
    <div class="now-tabs"><button data-tab="queue" class="on">Up next</button><button data-tab="lyrics">Lyrics</button><button data-tab="video">Video</button></div>
    <div class="now-art"><img id="nowArt" alt=""><div id="nowFrameWrap"><iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture" title="Player"></iframe></div></div>
    <div class="now-meta"><div id="nowTitle">Nothing playing</div><div id="nowArtist">Search for a song to start</div></div>
    <div id="nowBody"></div>
  </aside>

  <footer id="player">
    <div class="p-left"><img id="pArt" alt=""><div><div id="pTitle">—</div><div id="pArtist"></div></div><button id="pLike" class="icon" title="Like">♡</button></div>
    <div class="p-center">
      <div class="p-btns">
        <button id="pShuffle" class="icon small" title="Shuffle">⤮</button>
        <button id="pPrev" class="icon" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="pPlay" class="play" title="Play"><svg viewBox="0 0 24 24" id="pPlayIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="pNext" class="icon" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button id="pRepeat" class="icon small" title="Repeat">⟳</button>
      </div>
      <div class="p-seek"><span id="pCur">0:00</span><input type="range" id="pSeek" min="0" max="1000" value="0"><span id="pDur">0:00</span></div>
    </div>
    <div class="p-right"><button id="pQueue" class="icon small" title="Now playing panel">☰</button><span class="vol-ic">🔊</span><input type="range" id="pVol" min="0" max="100" value="80"></div>
  </footer>
  <div id="toast"></div>
  <script type="module" src="music.js"></script>
</body>
</html>
