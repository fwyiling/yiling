<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0d22"/><stop offset="1" stop-color="#07040b"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e"/><stop offset=".55" stop-color="#fa1e4e"/><stop offset="1" stop-color="#b3127f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke="url(#fg)" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt">
    <!-- outer triangle (point down) -->
    <path d="M17 27 H111 L64 111 Z" stroke-width="11"/>
    <!-- angular S inside, strokes parallel to the triangle's edges -->
    <path d="M89 42 H45 L55 59 H80 L67 82 H50" stroke-width="10"/>
  </g>
</svg>
