<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Messenger</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #6cc3bf; color: #1f3b3a; font: 18px system-ui, sans-serif; text-align: center; }
    img { width: 96px; height: 96px; }
    button { font: inherit; padding: 10px 28px; border: 2px solid #1f3b3a; border-radius: 8px;
      background: #f4f1e6; color: #1f3b3a; cursor: pointer; }
    button:hover { background: #fff; }
  </style>
</head>
<body>
  <img src="build/icon.png" alt="">
  <div>Can't reach Messenger.<br>Check your internet connection.</div>
  <button onclick="location.href='https://messenger.abeto.co/'">Try again</button>
</body>
</html>
