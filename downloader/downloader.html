<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shield Client – Download</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 520px; margin: 48px auto; padding: 0 16px; color: #1c1c1e; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #eee; background: #1c1c1e; } progress { filter: brightness(.9); } }
    h1 { font-size: 18px; margin: 0 0 4px; word-break: break-word; }
    progress { width: 100%; height: 14px; margin: 16px 0 8px; }
    #log { color: #888; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1 id="title">Preparing…</h1>
  <progress id="bar" value="0" max="1"></progress>
  <div id="status"></div>
  <div id="log"></div>
  <script type="module" src="downloader.js"></script>
</body>
</html>
