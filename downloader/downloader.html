<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syndicates Client · Download</title>
  <link rel="stylesheet" href="downloader.css">
</head>
<body>
  <main>
    <header>
      <img src="../icons/icon48.png" alt="" width="36" height="36">
      <div>
        <div class="kicker" id="kicker">Download</div>
        <h1 id="series">Loading…</h1>
      </div>
    </header>

    <!-- STEP 1: setup -->
    <section id="setup" hidden>
      <div id="langRow" hidden>
        <h2>Language</h2>
        <div class="langs" id="langs"></div>
        <label class="saver"><input type="checkbox" id="saver"> Smaller files (MangaDex data-saver, lower quality)</label>
      </div>
      <h2>1 · Which chapters?</h2>
      <div class="presets" id="presets"></div>
      <div class="range" id="rangeRow">
        <label>From <select id="from"></select></label>
        <label>to <select id="to"></select></label>
        <span class="count" id="count"></span>
      </div>

      <h2>2 · How do you want to read it?</h2>
      <div class="formats" id="formats"></div>

      <button class="go" id="start">Start download</button>
      <p class="note">Files are saved to your <b>Downloads</b> folder, in <b>Syndicates Client/<span id="folder"></span></b>.</p>
    </section>

    <!-- STEP 2: progress -->
    <section id="run" hidden>
      <div class="big">
        <div class="pct" id="pct">0%</div>
        <div>
          <div class="now" id="now">Starting…</div>
          <div class="sub" id="sub"></div>
        </div>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <ol class="list" id="list"></ol>
      <div class="actions">
        <button class="ghost" id="cancel">Cancel</button>
      </div>
    </section>

    <!-- STEP 3: done -->
    <section id="done" hidden>
      <div class="ok">✓</div>
      <h2 class="center" id="doneTitle">All done!</h2>
      <p class="center sub" id="doneSub"></p>
      <div class="actions center">
        <button class="go" id="open">Open reader</button>
        <button class="ghost" id="show">Show in folder</button>
      </div>
      <p class="center sub" id="failed"></p>
    </section>
  </main>
  <script type="module" src="downloader.js"></script>
</body>
</html>
